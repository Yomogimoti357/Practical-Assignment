<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="廃棄宇宙施設を探索する協力型SFホラーゲーム、ECHO//VOIDのストアページ。"
    />
    <meta property="og:title" content="ECHO//VOID — NEXUS STORE" />
    <meta
      property="og:description"
      content="光を絶やすな。声を信じるな。最大4人で挑む協力型SFホラー。"
    />
    <meta property="og:image" content="img/2026-08-17_174403.png" />
    <title>ECHO//VOID — NEXUS STORE</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header class="global-header" aria-hidden="true"></header>

    <main class="store-page">
      <section class="showcase" aria-label="ゲームの紹介">
        <div class="media-gallery">
          <div class="media-stage" id="mediaStage">
            <img
              id="mainImage"
              src="img/2026-08-17_174403.png"
              alt="暗闇の中で目を覚ます破損した探索ロボット"
            />
            <div class="scanlines" aria-hidden="true"></div>
            <span class="media-label" id="mediaLabel">SCREENSHOT 03</span>
            <button class="gallery-arrow gallery-arrow--prev" id="previousButton" type="button" aria-label="前の画像">
              ‹
            </button>
            <button class="gallery-arrow gallery-arrow--next" id="nextButton" type="button" aria-label="次の画像">
              ›
            </button>
            <button class="expand-button" id="expandButton" type="button" aria-label="画像を拡大表示">
              <span aria-hidden="true">⛶</span>
            </button>
          </div>

          <div class="thumbnail-row" id="thumbnailRow" aria-label="スクリーンショット一覧">
            <button class="thumbnail" type="button" data-index="0" aria-label="スクリーンショット1を表示">
              <img src="img/2026-08-17_174320.png" alt="強い光を放つ施設中央の装置" />
            </button>
            <button class="thumbnail" type="button" data-index="1" aria-label="スクリーンショット2を表示">
              <img src="img/2026-08-17_174352.png" alt="非常灯だけが点灯する暗い通路" />
            </button>
            <button class="thumbnail is-active" type="button" data-index="2" aria-label="スクリーンショット3を表示" aria-current="true">
              <img src="img/2026-08-17_174403.png" alt="破損した探索ロボットのクローズアップ" />
            </button>
          </div>
        </div>

        <aside class="game-summary">
          <div class="cover-art">
            <img src="img/2026-08-17_174320.png" alt="ECHO VOIDのカバーアート" />
            <div class="cover-shade"></div>
            <div class="cover-title" aria-hidden="true">

              <strong><span>Monitor</span></strong>
            </div>
          </div>



        </aside>
      </section>

    </main>

    <footer class="site-footer" aria-hidden="true"></footer>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="スクリーンショット拡大表示" hidden>
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="閉じる">×</button>
      <img id="lightboxImage" src="img/2026-08-17_174403.png" alt="" />
      <p id="lightboxCaption"></p>
    </div>

  </body>
</html>
